spring:
  application:
    name: ticket-on-api
  autoconfigure:
    exclude:
      # 계정 확인은 각 계정의 로그인 유스케이스가 한다. Spring Boot가 만드는 기본 사용자(생성 비밀번호)를 두지 않는다
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketon}
    username: ${DB_USERNAME:ticketon}
    password: ${DB_PASSWORD:ticketon}
  flyway:
    # 마이그레이션은 API 서버만 실행한다 (batch는 끔)
    enabled: true
  session:
    jdbc:
      # 세션 표는 Flyway 마이그레이션(V1)이 만든다
      initialize-schema: never
  web:
    # 다국어는 만들지 않는다(docs/99). 입력 검증 문구가 요청 언어(Accept-Language)에 따라 바뀌지 않게 한국어로 고정한다
    locale: ko_KR
    locale-resolver: fixed

server:
  servlet:
    session:
      # 로그인 세션 쿠키 (Spring Session). 비활성 만료 시간은 정책 숫자 모음에서 가져온다(LoginSessionConfiguration)
      cookie:
        # 화면 스크립트가 세션 쿠키를 읽지 못하게 한다
        http-only: true
        # 다른 사이트에서 시작한 POST 등에는 쿠키가 실리지 않는다. 링크를 눌러 들어오는 GET에는 실린다
        same-site: lax

ticketon:
  web:
    # 화면(웹) 기준 주소 — 메일·문자 속 링크(이메일 인증 등)와 카카오·구글 로그인 뒤 돌아갈 화면이 이 주소로 시작한다. 운영은 application-prod.yml
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  # 파일(주최자 로고 등) — 업체는 배포 때 정한다(docs/16). 그때까지 로컬 디스크에 저장한다(infra-storage). 레포 안에는 쓰지 않는다
  storage:
    local:
      # 저장 위치. 개발 기본값은 사용자 폴더 아래 개발용 경로다. 운영은 application-prod.yml
      directory: ${LOCAL_STORAGE_DIRECTORY:${user.home}/.ticket-on/storage}
      # 공개 기준 주소 — 이 서버의 파일 공개 경로(/api/public/files). 화면은 로고 주소를 이 주소로 시작하는 절대 주소로 받는다
      public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL:http://localhost:8080/api/public/files}
  # 관객 카카오·구글 로그인 (docs/16). 클라이언트 id·시크릿은 환경 변수로만 받는다(.env.example) — 레포에 키를 넣지 않는다.
  # 키가 없는 제공자는 켜지지 않는다(서버는 뜨고 그 제공자의 로그인 시작 주소만 404).
  # 제공자 개발자 콘솔에 등록할 콜백 주소: {서버 주소}/api/auth/audience/oauth2/callback/kakao, …/callback/google
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      # 카카오 동의 항목 — 이메일. 이름(name)은 카카오 앱 설정에서 권한을 받은 뒤 더한다
      scopes:
        - account_email
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
      # OpenID Connect(openid)는 쓰지 않는다 — 사용자 정보 주소로 이름·이메일을 읽는다
      scopes:
        - profile
        - email

springdoc:
  api-docs:
    path: /v3/api-docs
  # 응답 본문은 모두 JSON이다. 명세의 응답 형식을 */* 대신 application/json으로 적어 화면 타입이 정확해진다
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
