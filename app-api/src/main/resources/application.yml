spring:
  application:
    name: ticket-on-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketon}
    username: ${DB_USERNAME:ticketon}
    password: ${DB_PASSWORD:ticketon}
  flyway:
    # 마이그레이션은 API 서버만 실행한다 (batch는 끔)
    enabled: true
  session:
    jdbc:
      # 세션 표는 Flyway 마이그레이션(V1)이 만든다
      initialize-schema: never

springdoc:
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
