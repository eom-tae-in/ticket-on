# 운영 프로필 — HTTPS로만 서비스한다.
server:
  servlet:
    session:
      cookie:
        # 세션 쿠키를 HTTPS 연결에만 싣는다
        secure: true

ticketon:
  web:
    # 운영에서는 기본값을 두지 않는다. WEB_BASE_URL이 없으면 서버가 뜨지 않는다(메일에 로컬 주소가 나가지 않게)
    base-url: ${WEB_BASE_URL}
  # 파일 업체를 정하기 전까지 운영도 로컬 저장을 쓴다면 저장 위치와 공개 기준 주소를 꼭 받는다(개발용 경로 · 로컬 주소가 나가지 않게)
  storage:
    local:
      directory: ${LOCAL_STORAGE_DIRECTORY}
      public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL}
