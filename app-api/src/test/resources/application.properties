# 테스트에서만 쓰는 설정. main의 application.yml을 대신하지 않고 그 위에 더해진다(파일 이름이 달라 둘 다 읽힌다).
# 이 폴더에 application.yml을 만들면 main의 application.yml을 가리므로 만들지 않는다.

# 내장 서버를 띄우는 통합 테스트(RANDOM_PORT)는 서버를 테스트가 요청을 보내는 바로 그 주소(localhost)에만 바인딩한다 (#210).
# 기본값(모든 주소)으로 두면 macOS에서는 다른 프로그램이 같은 포트의 127.0.0.1을 이미 쥐고 있어도 운영체제가 그 포트를 서버에 내주고,
# localhost로 보낸 요청은 더 구체적인 주소를 쥔 그 프로그램으로 가서 엉뚱한 404를 받는다(간헐 실패).
# 주소를 지정하면 운영체제는 그 주소에서 비어 있는 포트만 내주고, 다른 프로그램이 나중에 같은 주소·포트를 쥘 수도 없다.
server.address=localhost
