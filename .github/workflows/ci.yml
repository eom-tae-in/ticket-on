name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 실행이 시작되면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 잡 이름(server, web)은 main 보호 규칙의 필수 검사 이름이다. 바꾸지 않는다.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # GitHub 러너에는 Docker가 있어 Testcontainers 테스트가 실제로 돈다
      - run: ./gradlew build
      # 테스트 수를 남기고, 건너뛴 테스트(예: Docker 문제로 꺼진 Testcontainers)가 있으면 실패시킨다
      - name: 테스트 결과 확인
        if: success() || failure()
        run: python3 .github/scripts/check_test_results.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
